    # palavra-chave, na ordem abaixo. O texto original fica em bl_tipo_or.
    campo: processo
    palavras_chave:
      - {padrao: "escorreg|desliz", tipologia: [Deslizamento, null]}
      - {padrao: "solapamento", tipologia: [Erosão, Erosão de margem fluvial]}
      - {padrao: "inunda", tipologia: [Inundação, null]}
      - {padrao: "alagamento", tipologia: [Alagamento, null]}
      - {padrao: "enchente", tipologia: [Enchente, null]}
      - {padrao: "enxurrada", tipologia: [Enxurrada, null]}
      - {padrao: "rolamento de bloco|queda de bloco", tipologia: [Queda, Queda de blocos]}
      - {padrao: "corrida", tipologia: [Corrida de massa, null]}
      - {padrao: "erosao", tipologia: [Erosão, null]}
  campos:
    local: "{area}, {bairro}"
    descricao: "Setor {codareas_1}. {processo}"
    obs_ocup: diagnostic
    num_edif: edificacoe
    num_pess: pessoas_ri
    sug_interv: recomendac
contato: null
notas: >-
  178 setores de R1 a R4 da Defesa Civil de Suzano. A CPRM não tem setores em
  Suzano. A camada traz o ano (2019) no nome, não a data de cada setor, por
  isso data_setor fica vazio.
