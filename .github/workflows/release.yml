name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar build
        run: pip install build

      - name: Empacotar (sdist + wheel)
        run: python -m build

      - name: Notas a partir do CHANGELOG
        # As notas automáticas do GitHub listam commits e PRs, que já estão no
        # histórico. Quem lê uma Release quer o CHANGELOG. Falha se a versão
        # não tiver seção lá: Release com corpo vazio é pior que Release que
        # não sai, porque ninguém confere o corpo depois.
        run: |
          python scripts/notas_release.py \
            --versao "${GITHUB_REF_NAME}" \
            --saida notas.md
          cat notas.md

      - name: Criar release e anexar artefatos
        # make_latest: false de propósito. O produto deste repositório é o
        # dado, e as URLs documentadas em docs/usar-os-dados.md usam
        # `releases/latest/download/`, que tem de resolver sempre para a
        # última Release de DADOS. Se o release de código virasse o `latest`,
        # essas URLs passariam a dar 404, porque aqui só vão sdist e wheel.
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notas.md
          make_latest: "false"
